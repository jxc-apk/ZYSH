name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 指定 Android SDK 路径
        run: echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties

      - name: 打开 AndroidX（上次失败就是缺这一行）
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n' > gradle.properties
          cat gradle.properties

      - name: 装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 编译 APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 记录日志和 APK 清单（不管成败都跑）
        if: always()
        run: |
          mkdir -p .logs
          {
            echo "===== 编译结果 ====="
            echo "build outcome: ${{ steps.build.outcome }}"
            echo ""
            echo "===== 找 APK ====="
            find . -name '*.apk' -not -path './.git/*' | head -50
            echo ""
            echo "===== 编译日志尾部 ====="
            tail -c 120000 build.log 2>/dev/null
          } > .logs/build-error.log 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .logs/build-error.log
          git commit -m "记录编译日志" || true
          git push || true

      - name: 把 APK 传上来供下载
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn
